<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>MathDesk - 現代數學課程全集影院與雙開講義</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX for mathematical typography -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    .math-font {
      font-family: 'KaTeX_Math', 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    .panel-transition {
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1), flex 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="h-full bg-[#0b0f19] text-slate-100 flex flex-col font-sans select-none overflow-hidden antialiased">

  <!-- Top Navigation & Control Header -->
  <header class="h-12 bg-[#0f172a] border-b border-slate-800 px-3.5 py-1 flex items-center justify-between flex-shrink-0 z-30 gap-2">
    <!-- Left: App Branding & Course Selector -->
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1.5">
        <div class="w-6 h-6 rounded-lg bg-slate-900 border border-slate-700 flex items-center justify-center text-amber-400 font-serif font-bold text-xs shadow-inner">
          ∫
        </div>
        <span class="text-xs font-bold tracking-tight text-white hidden sm:inline">MathDesk</span>
        <a href="./" id="back-to-game-link" class="hidden text-[11px] bg-amber-600 hover:bg-amber-500 text-white px-2 py-0.5 rounded font-medium transition items-center gap-1 shadow-sm" title="回到 RPG 遊戲">
          🎮 返回遊戲
        </a>
      </div>

      <!-- Segmented Course Selector -->
      <div class="flex items-center bg-slate-900 p-0.5 rounded-lg border border-slate-800 text-xs">
        <button onclick="switchCourse('calculus')" id="nav-btn-calculus" class="course-tab px-2.5 py-1 rounded-md font-medium transition-all bg-blue-600 text-white shadow-sm">
          微積分 (556部)
        </button>
        <button onclick="switchCourse('linear_algebra')" id="nav-btn-linear_algebra" class="course-tab px-2.5 py-1 rounded-md font-medium transition-all text-slate-400 hover:text-slate-200">
          線性代數 (106講)
        </button>
        <button onclick="switchCourse('discrete_math')" id="nav-btn-discrete_math" class="course-tab px-2.5 py-1 rounded-md font-medium transition-all text-slate-400 hover:text-slate-200">
          離散數學 (95講)
        </button>
      </div>
    </div>

    <!-- Center: Section Selector Dropdown + Prev/Next -->
    <div class="flex items-center gap-1 max-w-sm sm:max-w-md mx-1">
      <button onclick="navigateSection(-1)" class="p-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-white text-xs transition" title="上一節 (方向鍵 ←)">
        ◀
      </button>

      <!-- Section Dropdown -->
      <select id="section-dropdown" onchange="switchSection(parseInt(this.value))" 
        class="bg-slate-900 text-slate-200 text-xs px-2 py-1.5 rounded-lg border border-slate-800 focus:outline-none focus:border-blue-500 font-medium truncate max-w-[220px] sm:max-w-[280px] cursor-pointer">
      </select>

      <button onclick="navigateSection(1)" class="p-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-white text-xs transition" title="下一節 (方向鍵 →)">
        ▶
      </button>
    </div>

    <!-- Right: Split Screen Layout Toggle & Speed Control -->
    <div class="flex items-center gap-2">
      <!-- Speed selector -->
      <div class="hidden md:flex items-center gap-1 bg-slate-900 px-2 py-1 rounded-lg border border-slate-800 text-xs text-slate-300">
        <span class="text-[10px] text-slate-400">倍速:</span>
        <select onchange="changeSpeed(this.value)" class="bg-transparent text-xs text-white focus:outline-none cursor-pointer">
          <option value="0.75">0.75x</option>
          <option value="1">1.0x</option>
          <option value="1.25" selected>1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="1.75">1.75x</option>
          <option value="2">2.0x</option>
        </select>
      </div>

      <!-- Layout Split Switcher (50:50, Only Video, Only PDF) -->
      <div class="flex items-center bg-slate-900 p-0.5 rounded-lg border border-slate-800 text-xs">
        <button onclick="setLayoutMode('split')" id="layout-btn-split" class="layout-btn px-2.5 py-1 rounded-md font-medium transition bg-slate-700 text-white shadow-sm" title="左右雙開：左邊影片，右邊講義對照">
          🌗 雙開對照
        </button>
        <button onclick="setLayoutMode('video')" id="layout-btn-video" class="layout-btn px-2 py-1 rounded-md font-medium transition text-slate-400 hover:text-slate-200" title="全寬專注播放影片">
          📺 僅影片
        </button>
        <button onclick="setLayoutMode('pdf')" id="layout-btn-pdf" class="layout-btn px-2 py-1 rounded-md font-medium transition text-slate-400 hover:text-slate-200" title="全寬研讀講義教材">
          📄 僅講義
        </button>
      </div>
    </div>
  </header>

  <!-- Main Body: Side-by-Side Split View (Left: Video, Right: Built-in PDF) -->
  <main class="flex-1 relative flex overflow-hidden w-full h-full" id="split-main-container">
    
    <!-- LEFT PANEL: Video Cinema & Video Playlist (50% default) -->
    <div id="video-panel" class="panel-transition flex flex-col justify-between p-3 bg-[#070b12] border-r border-slate-800/80 overflow-y-auto" style="width: 50%; min-width: 320px;">
      
      <!-- Video Frame Wrapper -->
      <div class="w-full flex-1 flex flex-col justify-center items-center my-auto">
        <div class="w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800 relative">
          <iframe id="video-frame" class="w-full h-full" 
            src="https://www.youtube-nocookie.com/embed/M_ybjcBk_9w?enablejsapi=1" 
            title="Course Video Player" frameborder="0" 
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
          </iframe>
        </div>

        <!-- Video Bottom Chapter Bar & Sub-Video Parts Selector -->
        <div class="w-full mt-2.5 flex flex-col gap-2 bg-slate-900/80 border border-slate-800/80 px-3 py-2 rounded-xl">
          
          <!-- Top Row: Interactive Sub-Video Parts Selector (集數選單) -->
          <div class="flex items-center justify-between gap-2 overflow-x-auto pb-1 border-b border-slate-800/60">
            <div class="flex items-center gap-1.5 flex-shrink-0">
              <span class="text-xs text-amber-400 font-semibold flex items-center gap-1">
                <span>🎞️</span>
                <span id="parts-label">單元集數：</span>
              </span>
              <div id="sub-video-chips" class="flex items-center gap-1">
                <!-- Dynamically populated with Part buttons -->
              </div>
            </div>

            <!-- Quick Prev/Next Part buttons -->
            <div class="flex items-center gap-1 flex-shrink-0">
              <button onclick="navigateVideo(-1)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] border border-slate-700 transition" title="上一部 (快捷鍵 [)">
                ◀ 上一部
              </button>
              <button onclick="navigateVideo(1)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] border border-slate-700 transition" title="下一部 (快捷鍵 ])">
                下一部 ▶
              </button>
            </div>
          </div>

          <!-- Bottom Row: Timeline Jump Pills + Quick Sync to Right -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 overflow-x-auto py-0.5">
              <span class="text-xs text-slate-400 font-medium whitespace-nowrap">時間節點：</span>
              <div id="quick-jump-chips" class="flex items-center gap-1">
                <!-- Dynamically populated -->
              </div>
            </div>

            <div class="flex items-center gap-1.5 flex-shrink-0">
              <button onclick="syncRightPanelToCurrentPdf()" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs border border-slate-700 transition flex items-center gap-1" title="在右側顯示本節對應講義">
                <span>📖</span>
                <span>同步講義</span>
              </button>
              <button onclick="syncRightPanelToCurrentHomework()" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs border border-slate-700 transition flex items-center gap-1" title="在右側開啟課堂作業習題">
                <span>📝</span>
                <span>作業題本</span>
              </button>
              <button onclick="switchStudyTab('formulas')" class="px-2 py-1 rounded bg-blue-600/90 hover:bg-blue-500 text-white text-xs font-medium transition flex items-center gap-1 shadow-sm" title="在右側查閱核心公式">
                <span>📐</span>
                <span>公式</span>
              </button>
            </div>
          </div>

        </div>

        <!-- Subtitle/Topic Description -->
        <div class="w-full mt-2 px-1 flex items-center justify-between text-xs text-slate-400">
          <div class="truncate max-w-xl">
            <span class="text-slate-200 font-semibold" id="active-topic-name">Section 0101 · 函數四種表示法與定義域</span>
            <span class="text-slate-600 mx-1">—</span>
            <span id="active-topic-desc" class="text-slate-400">正在播放：0101-01</span>
          </div>
          <span class="text-[11px] text-slate-500 font-mono hidden lg:inline">[ / ] 切換集數 · ← / → 切換章節</span>
        </div>
      </div>

    </div>

    <!-- RIGHT PANEL: Built-in PDF Reader & Study Panel (50% default) -->
    <div id="study-panel" class="panel-transition flex flex-col bg-[#0b0f19] overflow-hidden" style="width: 50%; min-width: 320px;">
      
      <!-- Right Panel Top Bar -->
      <div class="h-11 bg-slate-950 border-b border-slate-800 px-3 flex items-center justify-between flex-shrink-0 gap-2">
        <!-- Study Tabs: 📄 講義教材 / 📐 重點公式 / 📑 章節目錄 -->
        <div class="flex items-center gap-1 bg-slate-900 p-0.5 rounded-lg border border-slate-800 text-xs flex-shrink-0">
          <button onclick="switchStudyTab('pdf')" id="tab-btn-pdf" class="study-tab-btn px-2.5 py-1 rounded font-medium transition bg-blue-600 text-white shadow-sm flex items-center gap-1">
            <span>📄</span>
            <span>講義教材</span>
          </button>
          <button onclick="switchStudyTab('formulas')" id="tab-btn-formulas" class="study-tab-btn px-2 py-1 rounded font-medium transition text-slate-400 hover:text-slate-200 flex items-center gap-1">
            <span>📐</span>
            <span>重點公式</span>
          </button>
          <button onclick="switchStudyTab('sections')" id="tab-btn-sections" class="study-tab-btn px-2 py-1 rounded font-medium transition text-slate-400 hover:text-slate-200 flex items-center gap-1">
            <span>📑</span>
            <span>章節目錄</span>
          </button>
        </div>

        <div class="flex-1 min-w-[160px] max-w-[340px]">
          <select id="pdf-selector" onchange="loadPdfDirectly(this.value)"

            <!-- Dynamically populated -->
          </select>
        </div>

        <!-- Quick Action: Open in new tab -->
        <div class="flex items-center gap-1 flex-shrink-0">
          <button onclick="openCurrentPdfInNewTab()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs border border-slate-700 transition flex items-center gap-1" title="在新分頁開啟目前講義">
            <span>↗</span>
            <span class="hidden sm:inline">新分頁開啟</span>
          </button>
        </div>
      </div>

      <!-- Right Panel Main Content Views -->
      <div class="flex-1 relative w-full h-full overflow-hidden bg-slate-950">
        
        <!-- View 1: Built-in Native PDF Viewer Iframe (Dominant) -->
        <div id="study-view-pdf" class="w-full h-full relative">
          <iframe id="pdf-viewer-frame" class="w-full h-full border-0 bg-slate-900" 
            src="./pdf/calculus/clp_1_dc_text.pdf" 
            title="PDF 講義檢視器"
            allowfullscreen>
          </iframe>
        </div>

        <!-- View 2: KaTeX Formulas Cards -->
        <div id="study-view-formulas" class="hidden absolute inset-0 overflow-y-auto p-4 space-y-4 bg-slate-900">
          <div class="flex items-center justify-between text-xs text-slate-400 pb-2 border-b border-slate-800">
            <span class="font-semibold text-slate-200" id="formula-header-title">核心公式與定理</span>

          <div class="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-2">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide">定義與性質</div>
            <div class="text-sm text-slate-200 font-medium" id="formula-def-text"></div>
            <div class="p-3 bg-slate-900 rounded-lg text-amber-300 font-mono text-center text-sm md:text-base border border-slate-800/80" id="formula-math-display"></div>
          </div>

          <div class="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-2">
            <div class="text-xs font-semibold text-emerald-400 uppercase tracking-wide" id="formula-thm-title">定理</div>
            <div class="text-xs text-slate-300 leading-relaxed" id="formula-thm-body"></div>
            <div class="p-2.5 bg-slate-900 rounded-lg text-emerald-300 font-mono text-center text-xs md:text-sm border border-slate-800/80" id="formula-thm-formula"></div>
          </div>

          <div class="p-3.5 bg-rose-950/20 border border-rose-900/40 rounded-xl">
            <div class="text-xs font-semibold text-rose-400 flex items-center gap-1 mb-1">
              <span>⚠️</span>
              <span>盲點警示與易錯提示</span>
            </div>
            <div class="text-xs text-rose-200/90 leading-relaxed" id="formula-pitfall-text"></div>
          </div>
        </div>

        <!-- View 3: Searchable Section Catalog -->
        <div id="study-view-sections" class="hidden absolute inset-0 overflow-y-auto p-4 space-y-3 bg-slate-900">
          <div class="flex items-center justify-between text-xs text-slate-400">
            <span class="font-semibold text-slate-200">章節目錄清單</span>
            <span id="catalog-count-badge" class="font-mono text-[11px] px-2 py-0.5 rounded bg-slate-800 text-slate-300"></span>
          </div>

          <div class="relative">
            <input type="text" id="section-search-input" oninput="renderDrawerSectionList(this.value)"

              class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
          </div>

          <div id="drawer-section-list" class="space-y-2 pb-6">
            <!-- Dynamically populated -->
          </div>
        </div>

      </div>

    </div>

  </main>

      });
    });

    // Populate course-specific PDFs in dropdown
    function populatePdfSelector() {
      const select = document.getElementById('pdf-selector');
      if (!select) return;
      select.innerHTML = '';

      const pdfList = COURSE_BUILTIN_PDFS[currentCourseKey] || [];
      pdfList.forEach((item) => {
        const opt = document.createElement('option');
        opt.value = item.url;
        opt.textContent = item.label;
        select.appendChild(opt);
      });

      if (pdfList.length > 0) {
        currentPdfUrl = pdfList[0].url;
        loadPdfDirectly(currentPdfUrl);
      }
    }

    function loadPdfDirectly(url) {
      if (!url) return;
      currentPdfUrl = url;
      const frame = document.getElementById('pdf-viewer-frame');
      if (frame && frame.src !== url) {
        frame.src = url;
      }
      const select = document.getElementById('pdf-selector');
      if (select && select.value !== url) {
        select.value = url;
      }
      switchStudyTab('pdf');
    }

    function openCurrentPdfInNewTab() {
      if (currentPdfUrl) {
        window.open(currentPdfUrl, '_blank');
      }
    }

    function syncRightPanelToCurrentPdf() {
      const course = COURSES[currentCourseKey];
      const sec = course.sections[currentSectionIndex];
      if (sec && sec.pdfFile) {
        loadPdfDirectly(sec.pdfFile);
      } else {
        const list = COURSE_BUILTIN_PDFS[currentCourseKey] || [];
        if (list.length > 0) loadPdfDirectly(list[0].url);
      }
    }

    function syncRightPanelToCurrentHomework() {
      const course = COURSES[currentCourseKey];
      const sec = course.sections[currentSectionIndex];
      if (sec && sec.homeworkFile) {
        loadPdfDirectly(sec.homeworkFile);
      } else {
        alert('此講次暫無特定作業習題，已為您開啟本課程教材庫！');
        syncRightPanelToCurrentPdf();
      }
    }

    // Layout Modes: Split (50:50), Only Video (100:0), Only PDF (0:100)
    function setLayoutMode(mode) {
      currentLayoutMode = mode;
      const vPanel = document.getElementById('video-panel');
      const sPanel = document.getElementById('study-panel');

      // Update layout buttons
      ['split', 'video', 'pdf'].forEach((m) => {
        const btn = document.getElementById('layout-btn-' + m);
        if (btn) {
          if (m === mode) {
            btn.className = 'layout-btn px-2.5 py-1 rounded-md font-medium transition bg-slate-700 text-white shadow-sm';
          } else {
            btn.className = 'layout-btn px-2 py-1 rounded-md font-medium transition text-slate-400 hover:text-slate-200';
          }
        }
      });

      if (mode === 'split') {
        vPanel.style.display = 'flex';
        vPanel.style.width = '50%';
        sPanel.style.display = 'flex';
        sPanel.style.width = '50%';
      } else if (mode === 'video') {
        vPanel.style.display = 'flex';
        vPanel.style.width = '100%';
        sPanel.style.display = 'none';
      } else if (mode === 'pdf') {
        vPanel.style.display = 'none';
        sPanel.style.display = 'flex';
        sPanel.style.width = '100%';
      }
    }

    // Switch Study Tabs: pdf, formulas, sections
    function switchStudyTab(tab) {
      currentStudyTab = tab;
      
      // Ensure right panel is visible
      if (currentLayoutMode === 'video') {
        setLayoutMode('split');
      }

      ['pdf', 'formulas', 'sections'].forEach((t) => {
        const btn = document.getElementById('tab-btn-' + t);
        const view = document.getElementById('study-view-' + t);
        if (btn) {
          if (t === tab) {
            btn.className = 'study-tab-btn px-2.5 py-1 rounded font-medium transition bg-blue-600 text-white shadow-sm flex items-center gap-1';
          } else {
            btn.className = 'study-tab-btn px-2 py-1 rounded font-medium transition text-slate-400 hover:text-slate-200 flex items-center gap-1';
          }
        }
        if (view) {
          if (t === tab) {
            view.classList.remove('hidden');
          } else {
            view.classList.add('hidden');
          }
        }
      });

      if (tab === 'formulas') {
        renderFormulasPane();
      } else if (tab === 'sections') {
        renderDrawerSectionList();
      }
    }

    // Switch Course
    function switchCourse(key) {
      if (currentCourseKey === key) return;
      currentCourseKey = key;
      currentSectionIndex = 0;
      activeVideoIndex = 0;
      activeNodeIndex = 0;

      // Update Header nav tabs
      document.querySelectorAll('.course-tab').forEach(b => {
        b.className = 'course-tab px-2.5 py-1 rounded-md font-medium transition-all text-slate-400 hover:text-slate-200';
      });
      const activeBtn = document.getElementById(`nav-btn-${key}`);
      if (activeBtn) {
        activeBtn.className = 'course-tab px-2.5 py-1 rounded-md font-medium transition-all bg-blue-600 text-white shadow-sm';
      }

      populateSectionDropdown();
      populatePdfSelector();
      renderCurrentSection();
    }

    function populateSectionDropdown() {
      const course = COURSES[currentCourseKey];
      const select = document.getElementById('section-dropdown');
      select.innerHTML = '';

      course.sections.forEach((sec, idx) => {
        const option = document.createElement('option');
        option.value = idx;
        const countText = sec.videoCount ? ` (${sec.videoCount}部)` : '';
        option.textContent = `${sec.code}: ${sec.title}${countText}`;
        select.appendChild(option);
      });
      select.value = currentSectionIndex;
    }

    function switchSection(idx) {
      const course = COURSES[currentCourseKey];
      if (idx < 0 || idx >= course.sections.length) return;
      currentSectionIndex = idx;
      activeVideoIndex = 0;
      activeNodeIndex = 0;
      
      document.getElementById('section-dropdown').value = idx;
      renderCurrentSection();

      // Auto-sync right panel PDF to current section if available
      const sec = course.sections[idx];
      if (sec && sec.pdfFile) {
        loadPdfDirectly(sec.pdfFile);
      }
    }

    function navigateSection(delta) {
      const course = COURSES[currentCourseKey];
      const target = currentSectionIndex + delta;
      if (target >= 0 && target < course.sections.length) {
        switchSection(target);
      }
    }

    function selectSubVideo(idx) {
      const course = COURSES[currentCourseKey];
      const sec = course.sections[currentSectionIndex];
      if (idx < 0 || idx >= sec.videos.length) return;
      activeVideoIndex = idx;
      activeNodeIndex = 0;
      
      const v = sec.videos[idx];
      const iframe = document.getElementById('video-frame');
      iframe.src = `https://www.youtube-nocookie.com/embed/${v.videoId}?autoplay=1&enablejsapi=1`;
      updateActiveDetails();
    }

    function navigateVideo(delta) {
      const course = COURSES[currentCourseKey];
      const sec = course.sections[currentSectionIndex];
      const target = activeVideoIndex + delta;
      if (target >= 0 && target < sec.videos.length) {
        selectSubVideo(target);
      } else if (delta > 0 && currentSectionIndex + 1 < course.sections.length) {
        switchSection(currentSectionIndex + 1);
      } else if (delta < 0 && currentSectionIndex - 1 >= 0) {
        switchSection(currentSectionIndex - 1);
        const prevSec = course.sections[currentSectionIndex];
        selectSubVideo(prevSec.videos.length - 1);
      }
    }

    function renderCurrentSection() {
      const course = COURSES[currentCourseKey];
      const sec = course.sections[currentSectionIndex];
      const v = sec.videos[activeVideoIndex] || sec.videos[0];

      // Update Video iframe
      const iframe = document.getElementById('video-frame');
      iframe.src = `https://www.youtube-nocookie.com/embed/${v.videoId}?enablejsapi=1`;

      updateActiveDetails();
      renderSubVideoChips();
      renderQuickJumpChips();
      
      if (currentStudyTab === 'formulas') renderFormulasPane();
      if (currentStudyTab === 'sections') renderDrawerSectionList();
    }

    function renderSubVideoChips() {
      const course = COURSES[currentCourseKey];
      const sec = course.sections[currentSectionIndex];
      const container = document.getElementById('sub-video-chips');
      const label = document.getElementById('parts-label');
      container.innerHTML = '';

      label.textContent = `單元集數 (${sec.videos.length}部)：`;

      sec.videos.forEach((vid, idx) => {
        const btn = document.createElement('button');
        const isActive = (idx === activeVideoIndex);
        btn.className = `px-2 py-0.5 rounded text-xs font-medium transition ${
          isActive 
            ? 'bg-blue-600 text-white shadow-sm ring-1 ring-blue-400' 
            : 'bg-slate-800 text-slate-400 hover:text-slate-200 hover:bg-slate-700'
        }`;
        btn.textContent = `P${idx + 1} (${vid.code.split('-')[1] || vid.code})`;
        btn.onclick = () => selectSubVideo(idx);
        container.appendChild(btn);
      });
    }

    function renderQuickJumpChips() {
      const course = COURSES[currentCourseKey];
      const sec = course.sections[currentSectionIndex];
      const container = document.getElementById('quick-jump-chips');
      container.innerHTML = '';

      sec.nodes.forEach((node, idx) => {
        const btn = document.createElement('button');
        const isActive = (idx === activeNodeIndex);
        btn.className = `px-2 py-0.5 rounded text-xs transition border flex items-center gap-1 ${
          isActive 
            ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' 
            : 'bg-slate-800/80 text-slate-400 border-slate-700/60 hover:text-slate-200'
        }`;
        btn.innerHTML = `<span class="text-[10px] font-mono text-slate-500">${node.timeStr}</span> <span>${node.title}</span>`;
        btn.onclick = () => selectNode(idx);
        container.appendChild(btn);
      });
    }

    function selectNode(idx) {
      const course = COURSES[currentCourseKey];
      const sec = course.sections[currentSectionIndex];
      activeNodeIndex = idx;
      const node = sec.nodes[idx];

      const v = sec.videos[activeVideoIndex];
      const iframe = document.getElementById('video-frame');
      iframe.src = `https://www.youtube-nocookie.com/embed/${v.videoId}?start=${node.timeSec}&autoplay=1&enablejsapi=1`;

      renderQuickJumpChips();
    }

    function updateActiveDetails() {
      const course = COURSES[currentCourseKey];
      const sec = course.sections[currentSectionIndex];
      const v = sec.videos[activeVideoIndex] || sec.videos[0];

      document.getElementById('active-topic-name').textContent = `${sec.code} · ${sec.title}`;
      document.getElementById('active-topic-desc').textContent = `正在播放：${v.code} (${sec.unit})`;
    }

    function renderFormulasPane() {
      const course = COURSES[currentCourseKey];
      const sec = course.sections[currentSectionIndex];
      const f = sec.formulaSummary || {};

      document.getElementById('formula-header-title').textContent = `${sec.code} 核心公式與重點`;
      document.getElementById('formula-def-text').textContent = f.definition || '本講次著重於定理推導與應用實例。';
      document.getElementById('formula-math-display').textContent = f.formula ? `$$${f.formula}$$` : '$$f(x)$$';
      document.getElementById('formula-thm-title').textContent = f.theoremTitle || '核心定理';
      document.getElementById('formula-thm-body').textContent = f.theoremBody || '依據講義課程定義嚴格推論。';
      document.getElementById('formula-thm-formula').textContent = f.theoremFormula ? `$$${f.theoremFormula}$$` : '';
      document.getElementById('formula-pitfall-text').textContent = f.pitfall || '請注意運算邊界條件與定義域約束。';

      const formulasView = document.getElementById('study-view-formulas');
      if (window.renderMathInElement) {
        renderMathInElement(formulasView, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderDrawerSectionList(searchTerm = '') {
      const course = COURSES[currentCourseKey];
      const listContainer = document.getElementById('drawer-section-list');
      listContainer.innerHTML = '';

      const term = (searchTerm || '').trim().toLowerCase();
      let matchCount = 0;

      course.sections.forEach((sec, idx) => {
        if (term) {
          const fullText = `${sec.code} ${sec.title} ${sec.unit}`.toLowerCase();
          const matchVids = sec.videos.some(v => v.code.toLowerCase().includes(term) || v.title.toLowerCase().includes(term));
          if (!fullText.includes(term) && !matchVids) return;
        }
        matchCount++;

        const isCurrent = (idx === currentSectionIndex);
        const card = document.createElement('div');
        card.className = `p-2.5 rounded-lg border cursor-pointer transition ${
          isCurrent 
            ? 'bg-blue-900/30 border-blue-500/50 text-white ring-1 ring-blue-500/30' 
            : 'bg-slate-950/70 border-slate-800/80 text-slate-300 hover:bg-slate-800/80 hover:border-slate-700'
        }`;
        card.onclick = () => {
          switchSection(idx);
          switchStudyTab('pdf');
        };

        card.innerHTML = `
          <div class="flex items-center justify-between text-xs">
            <span class="font-mono font-bold text-amber-400">${sec.code}</span>
            <span class="text-[11px] text-slate-400 bg-slate-900 px-1.5 py-0.5 rounded">${sec.videoCount || sec.videos.length} 部影片</span>
          </div>
          <div class="text-xs font-medium text-slate-200 mt-1 line-clamp-1">${sec.title}</div>
          <div class="text-[11px] text-slate-500 mt-0.5 line-clamp-1">${sec.unit}</div>
        `;
        listContainer.appendChild(card);
      });

      const badge = document.getElementById('catalog-count-badge');
      if (badge) {
        badge.textContent = `共 ${matchCount} 節 · ${course.totalVideos || course.sections.reduce((a,c)=>a+c.videos.length,0)} 部`;
      }
    }

    function changeSpeed(val) {
      const iframe = document.getElementById('video-frame');
      iframe.contentWindow.postMessage(JSON.stringify({
        event: 'command',
        func: 'setPlaybackRate',
        args: [parseFloat(val)]
      }), '*');
    }
  </script>
</body>
</html>
